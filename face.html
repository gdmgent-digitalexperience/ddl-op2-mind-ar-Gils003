<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDL OP 2 - Mind AR Roger That</title>
    <link rel="stylesheet" href="./css/main.css">    
  </head>
  <body>

    <button class="switch-button" id="next-button">
      SWITCH
    </button>


    <a-assets>
      <a-asset-item
        id="finn"
        src="./assets/finn_adventure_time.glb"> 
      </a-asset-item>
      <a-asset-item
        id="glasses"
        src="./assets/thug_life_glasses.glb">
    </a-asset-item>
    </a-assets>

    <a-scene id="ar-scene"
      mindar-face
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity id="face-target" mindar-face-target="anchorIndex: 168">
      <a-gltf-model id="glasses-model"
          position="0 0 0" 
          rotation="0 0 0" 
          scale="0.5 0.5 0.5"
           src="#glasses">
      </a-gltf-model>
      <a-gltf-model id="finn-model"
          position="0 0 0" 
          rotation="0 0 0" 
          scale="1 1 1"
           src="#finn">
      </a-gltf-model>
      
    </a-entity>

    </a-scene>
    
    <script>
// Get references to DOM elements
const switchButton = document.getElementById("next-button");
const faceTarget = document.getElementById("face-target");
const glassesModel = document.getElementById("glasses-model");
const finnModel = document.getElementById("finn-model");
const sceneEl = document.querySelector("#ar-scene");
if (!sceneEl) console.warn('AR scene element not found');

// Wait for AR scene to be ready
sceneEl.addEventListener("arReady", () => {

  // Track which model is currently visible
  let showingGlasses = true;

  // Initialize models visibility
  glassesModel.setAttribute("visible", showingGlasses);
  finnModel.setAttribute("visible", !showingGlasses);

  // Show button when face target is detected
  faceTarget.addEventListener("targetFound", () => {
    switchButton.style.display = "block";
  });

  // Hide button when face target is lost
  faceTarget.addEventListener("targetLost", () => {
    switchButton.style.display = "none";
  });

  // Toggle between the two models on button click
  switchButton.addEventListener("click", () => {
    showingGlasses = !showingGlasses;
    console.log('toggle clicked, now showingGlasses=', showingGlasses);
    glassesModel.setAttribute("visible", showingGlasses);
    finnModel.setAttribute("visible", !showingGlasses);
  });

});
</script>
  </body>
</html>
